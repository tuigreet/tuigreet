name: Pull request build

permissions:
  contents: read

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'crates/**'
      - 'xtask/**'
      - 'contrib/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.rustfmt.toml'
      - '.github/workflows/rust.yml'
      - '.github/workflows/pr.yml'
      - '.github/workflows/release.yml'

jobs:
  validate:
    uses: ./.github/workflows/rust.yml
