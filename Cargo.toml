[workspace]
members  = [ "crates/*" ]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "GPL-3.0-only"
repository   = "https://github.com/tuigreet/tuigreet"
rust-version = "1.95.0"
version      = "0.11.0"

[workspace.dependencies]
# Workspace dependencies
tuigreet-config  = { path = "crates/tuigreet-config", version = "0.11.0" }
tuigreet-locales = { path = "crates/tuigreet-locales", version = "0.11.0" }
tuigreet-system  = { path = "crates/tuigreet-system", version = "0.11.0" }
tuigreet-theme   = { path = "crates/tuigreet-theme", version = "0.11.0" }
tuigreet-types   = { path = "crates/tuigreet-types", version = "0.11.0" }

# External
ansi-to-tui = "8.0.1"
chrono = { version = "0.4.45", features = [ "unstable-locales" ] }
codespan-reporting = "0.13.1"
crossterm = { version = "0.29.0", features = [ "event-stream" ] }
dirs = "7.0.0"
futures = "0.3.34"
getopts = "0.2.24"
greetd_ipc = { version = "0.10.3", features = [ "tokio-codec" ] }
i18n-embed = { version = "0.16.0", features = [ "desktop-requester", "fluent-system" ] }
i18n-embed-fl = "0.10.1"
nix = { version = "0.31.3", features = [ "feature", "ioctl" ] }
notify = { version = "8.2.0", features = [ "macos_fsevent" ] }
portable-atomic = "1"
rand = "0.10.3"
regex = "1.13.1"
rust-embed = "8.13.0"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = [ "derive" ] }
tokio = { version = "1.53.2", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "process",
] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui = { package = "ratatui", version = "0.30.2", default-features = false, features = [
  "crossterm",
  "unstable",
] }
unic-langid = "0.9.6"
utmp-rs = "0.4.0"
uzers = "0.12.2"
zeroize = "1.9.1"

# Dev
greetd-stub   = "0.3.0"
tempfile      = "3.27.0"
unicode-width = "0.2.2"

[workspace.lints.clippy]
cargo       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }

# Restrictions, and overrides for the groups above.
absolute_paths                       = "warn"
allow_attributes                     = "warn"
allow_attributes_without_reason      = "deny"
arbitrary_source_item_ordering       = "allow"
clone_on_ref_ptr                     = "warn"
dbg_macro                            = "deny"
disallowed_methods                   = "deny"
disallowed_types                     = "deny"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
excessive_nesting                    = "warn"
exit                                 = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "allow" # suggests panicking indexing; unwrap_used handles this
implicit_return                      = "allow"
infinite_loop                        = "warn"
iter_on_single_items                 = "warn"
let_underscore_future                = "deny"
map_with_unused_argument_over_ranges = "warn"
missing_docs_in_private_items        = "allow"
missing_safety_doc                   = "deny"
non_ascii_literal                    = "allow"
non_std_lazy_statics                 = "warn"
non_zero_suggestions                 = "warn"
pathbuf_init_then_push               = "warn"
pattern_type_mismatch                = "allow"
precedence_bits                      = "warn"
pub_underscore_fields                = "warn"
question_mark_used                   = "allow"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
redundant_clone                      = "warn"
rest_pat_in_fully_bound_structs      = "warn"
self_named_module_files              = "warn"
significant_drop_in_scrutinee        = "warn"
similar_names                        = "allow"
single_call_fn                       = "allow"
std_instead_of_core                  = "allow"
suspicious_operation_groupings       = "warn"
too_long_first_doc_paragraph         = "allow"
too_many_lines                       = "allow"
undocumented_unsafe_blocks           = "deny"
unnecessary_safety_comment           = "warn"
unused_peekable                      = "warn"
unused_result_ok                     = "warn"
unused_trait_names                   = "allow"

# Clippy does not recognize our workspace-inherited Cargo metadata.
cargo_common_metadata = "allow"

# Incompatible transitive versions :(
multiple_crate_versions = "allow"


# Tests may opt in locally; production panics need an explicit justification.
panic       = "deny"
unwrap_used = "deny"

# Review intentional panics and diagnostic output.
expect_used   = "warn"
print_stderr  = "warn"
print_stdout  = "warn"
todo          = "deny"
unimplemented = "deny"
unreachable   = "warn"

[workspace.lints.rust]
non_ascii_idents       = "warn" # prevent non-ASCII identifiers
tail_expr_drop_order   = "warn" # catch temporaries dropped in surprising order
unit_bindings          = "warn" # catch useless `let _ = expr` bindings
unsafe_code            = "warn" # guess.
unsafe_op_in_unsafe_fn = "deny" # require explicit unsafe blocks
unused_must_use        = "deny" # handle must-use results explicitly
unused_unsafe          = "warn" # catch unnecessary unsafe blocks


[profile.release]
codegen-units = 1
lto           = "thin"
strip         = "symbols"
