[workspace]
members  = [ "crates/*" ]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "GPL-3.0-only"
repository   = "https://github.com/tuigreet/tuigreet"
rust-version = "1.95.0"
version      = "0.11.0"

[workspace.dependencies]
# Workspace dependencies
tuigreet-config  = { path = "crates/tuigreet-config", version = "0.11.0" }
tuigreet-locales = { path = "crates/tuigreet-locales", version = "0.11.0" }
tuigreet-system  = { path = "crates/tuigreet-system", version = "0.11.0" }
tuigreet-theme   = { path = "crates/tuigreet-theme", version = "0.11.0" }
tuigreet-types   = { path = "crates/tuigreet-types", version = "0.11.0" }

# External
ansi-to-tui = "8.0.1"
chrono = { version = "0.4.45", features = [ "unstable-locales" ] }
codespan-reporting = "0.13.1"
crossterm = { version = "0.29.0", features = [ "event-stream" ] }
dirs = "6.0.0"
futures = "0.3.33"
getopts = "0.2.24"
greetd_ipc = { version = "0.10.3", features = [ "tokio-codec" ] }
i18n-embed = { version = "0.16.0", features = [ "desktop-requester", "fluent-system" ] }
i18n-embed-fl = "0.10.1"
nix = { version = "0.31.3", features = [ "feature", "ioctl", "net", "term" ] }
notify = { version = "8.2.0", features = [ "macos_fsevent" ] }
rand = "0.10.2"
rust-embed = "8.12.0"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = [ "derive" ] }
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "process",
] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui = { package = "ratatui", version = "0.30.2", default-features = false, features = [
  "crossterm",
  "unstable",
] }
unic-langid = "0.9.6"
utmp-rs = "0.4.0"
uzers = "0.12.2"
zeroize = "1.9.0"

# Dev
greetd-stub   = "0.3.0"
tempfile      = "3.27.0"
unicode-width = "0.2.2"

[profile.release]
codegen-units = 1
lto           = "thin"
